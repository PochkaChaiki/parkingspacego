name: CI + GitOps CD with Argo CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: write
  pull-requests: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY }}

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Download dependencies
        working-directory: backend
        run: go mod download && go mod verify
      - name: Run tests with coverage
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 1

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests with coverage
        working-directory: frontend
        env:
          CI: true
        run: |
          npm test a -- \
            --coverage \
            --coverageReporters=lcov \
            --watchAll=false
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  backend-build:
    name: Backend Build
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        working-directory: backend
        run: go mod download && go mod verify
      - name: Build server binary
        working-directory: backend
        run: go build -o parking-server ./cmd/app

  frontend-build:
    name: Frontend Build
    needs: frontend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build application
        working-directory: frontend
        run: npm run build

  sonarqube-scan:
    name: SonarQube Security Scan
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.scm.disabled=false

  docker-push:
    name: Build and Push Images to YCR
    needs: sonarqube-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops-values:
    name: Update Helm Values for Argo CD
    needs: docker-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install yq
        uses: mikefarah/yq@v4.44.3
      - name: Update image tags in values.yaml
        run: |
          yq -i '.backend.image = "backend:${{ needs.docker-push.outputs.image_tag }}"' helm/values.yaml
          yq -i '.frontend.image = "frontend:${{ needs.docker-push.outputs.image_tag }}"' helm/values.yaml
      - name: Commit GitOps image tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "cd: deploy image ${{ needs.docker-push.outputs.image_tag }}" || exit 0
          git push

  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, backend-build, frontend-build, sonarqube-scan, docker-push, update-gitops-values]
    if: always()
    steps:
      - name: Calculate pipeline status
        id: status
        env:
          BACKEND_TEST: ${{ needs.backend-test.result }}
          FRONTEND_TEST: ${{ needs.frontend-test.result }}
          BACKEND_BUILD: ${{ needs.backend-build.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          SONAR_SCAN: ${{ needs.sonarqube-scan.result }}
          DOCKER_PUSH: ${{ needs.docker-push.result }}
          GITOPS_UPDATE: ${{ needs.update-gitops-values.result }}
        run: |
          FINAL_STATUS="success"
          EMOJI="✅"
          DETAILS="✅ CI passed, images pushed, GitOps values updated. Argo CD will sync automatically."
          FAILED_JOB=""

          if [[ "$BACKEND_TEST" == "failure" ]]; then FINAL_STATUS="failure"; EMOJI="🐹"; DETAILS="❌ Backend tests failed"; FAILED_JOB="backend-test";
          elif [[ "$FRONTEND_TEST" == "failure" ]]; then FINAL_STATUS="failure"; EMOJI="⚛️"; DETAILS="❌ Frontend tests failed"; FAILED_JOB="frontend-test";
          elif [[ "$BACKEND_BUILD" == "failure" ]]; then FINAL_STATUS="failure"; EMOJI="🔨"; DETAILS="❌ Backend build failed"; FAILED_JOB="backend-build";
          elif [[ "$FRONTEND_BUILD" == "failure" ]]; then FINAL_STATUS="failure"; EMOJI="🔨"; DETAILS="❌ Frontend build failed"; FAILED_JOB="frontend-build";
          elif [[ "$SONAR_SCAN" == "failure" ]]; then FINAL_STATUS="failure"; EMOJI="🛡️"; DETAILS="❌ SonarQube scan failed"; FAILED_JOB="sonarqube-scan";
          elif [[ "$DOCKER_PUSH" == "failure" ]]; then FINAL_STATUS="failure"; EMOJI="📦"; DETAILS="❌ Docker push failed"; FAILED_JOB="docker-push";
          elif [[ "$GITOPS_UPDATE" == "failure" ]]; then FINAL_STATUS="failure"; EMOJI="🚀"; DETAILS="❌ GitOps values update failed"; FAILED_JOB="update-gitops-values";
          fi

          echo "status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"
          echo "emoji=$EMOJI" >> "$GITHUB_OUTPUT"
          echo "details=$DETAILS" >> "$GITHUB_OUTPUT"
          echo "failed_job=$FAILED_JOB" >> "$GITHUB_OUTPUT"
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ steps.status.outputs.emoji }} *CI/CD with Argo CD: ${{ steps.status.outputs.status == 'failure' && '🔴 FAILED' || '🟢 SUCCESS' }}*

            *📦* ${{ github.repository }} | *🌿* ${{ github.ref_name }}
            *💻* [${{ github.sha }}](${{ github.event.head_commit.url }}) | *👤* ${{ github.actor }}
            *📋 Result:* ${{ steps.status.outputs.details }}
            ${{ steps.status.outputs.failed_job != '' && format('*⚠️ Failed job:* `{0}`', steps.status.outputs.failed_job) || '' }}
            *🔧 Jobs status:*
            ```diff
            ${{ needs.backend-test.result == 'success' && '+ ' || (needs.backend-test.result == 'failure' && '- ' || '  ') }}Backend Tests:  ${{ needs.backend-test.result }}
            ${{ needs.frontend-test.result == 'success' && '+ ' || (needs.frontend-test.result == 'failure' && '- ' || '  ') }}Frontend Tests: ${{ needs.frontend-test.result }}
            ${{ needs.backend-build.result == 'success' && '+ ' || (needs.backend-build.result == 'failure' && '- ' || '  ') }}Backend Build: ${{ needs.backend-build.result }}
            ${{ needs.frontend-build.result == 'success' && '+ ' || (needs.frontend-build.result == 'failure' && '- ' || '  ') }}Frontend Build: ${{ needs.frontend-build.result }}
            ${{ needs.sonarqube-scan.result == 'success' && '+ ' || (needs.sonarqube-scan.result == 'failure' && '- ' || needs.sonarqube-scan.result == 'skipped' && '# ' || '  ') }}SonarQube:      ${{ needs.sonarqube-scan.result || 'skipped' }}
            ${{ needs.docker-push.result == 'success' && '+ ' || (needs.docker-push.result == 'failure' && '- ' || '  ') }}DockerFiles Push:   ${{ needs.docker-push.result }}
            ${{ needs.update-gitops-values.result == 'success' && '+ ' || (needs.update-gitops-values.result == 'failure' && '- ' || '  ') }}Update GitOps values:  ${{ needs.update-gitops-values.result }}
            ```
            [🔗 Open GitHub Actions →](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

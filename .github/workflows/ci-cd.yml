name: CI Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        working-directory: backend 
        run: go mod download && go mod verify
      
      - name: Run tests
        working-directory: backend 
        run: go test -v -race -coverprofile=coverage.out ./...

  backend-build:
    name: Backend Build
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        working-directory: backend 
        run: go mod download && go mod verify
      
      - name: Build server binary
        working-directory: backend 
        run: go build -o parking-server ./cmd/app

  frontend-test:
    name: Frontend Test
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      
      - name: Run tests
        working-directory: frontend
        run: npm test -- --coverage --passWithNoTests --watchAll=false --ci

  frontend-build:
    name: Frontend Build
    needs: frontend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      
      - name: Build application
        working-directory: frontend
        run: npm run build

  backend-push:
    name: Backend Push to YCR
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}
          # cr-id: ${{ secrets.YC_CR_ID }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        env:
          CR_REGISTRY: ${{ secrets.YC_REGISTRY }}
        with:
          context: backend
          file: backend/Dockerfile.backend
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY }}/backend:${{ github.sha }}
            cr.yandex/${{ secrets.YC_REGISTRY }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-push:
    name: Frontend Push to YCR
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}
          cr-id: ${{ secrets.YC_CR_ID }}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.frontend
          push: true
          tags: |
            cr.yandex/crpm5i3fj81cq0ka0o72/frontend:${{ github.sha }}
            cr.yandex/crpm5i3fj81cq0ka0o72/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max 

# =============================================================================
# SONARQUBE CONFIGURATION - Parking App
# =============================================================================

# --- ОБЩИЕ НАСТРОЙКИ ---
sonar.projectKey=parking-app
sonar.projectName=Parking Application
sonar.organization=pochkachaiki
sonar.host.url=https://sonarqube.io

# --- ИСХОДНЫЙ КОД ---
sonar.sources=backend,frontend
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/*.config.js,\
  **/jest.setup.js,\
  **/__tests__/**,\
  **/*.test.js,\
  **/*.spec.js,\
  frontend/.next/**,\
  frontend/out/**,\
  frontend/public/**

# --- TESTS ---
sonar.tests=backend,frontend
sonar.test.inclusions=**/__tests__/**/*.test.js,**/__tests__/**/*.test.jsx,**/*_test.go,**/*_test.go

# =============================================================================
# BACKEND (Golang)
# =============================================================================
sonar.language=go
sonar.go.coverage.reportPaths=backend/coverage.out
# Для тест-отчётов Go используем Generic Test Data формат
# sonar.go.tests.reportPaths=backend/sonar-test-report.json

# =============================================================================
# FRONTEND (Next.js + JavaScript + Jest)
# =============================================================================
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Тест-отчёт в формате SonarQube Generic Test Data
# sonar.testExecutionReportPaths=frontend/sonar-test-report.json

# Настройки для анализа JavaScript/JSX
sonar.javascript.file.suffixes=.js,.jsx
sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/jest.config.js,\
  **/jest.setup.js,\
  frontend/src/pages/_*.js

# =============================================================================
# QUALITY GATE SETTINGS
# =============================================================================
# Ждать завершения анализа и проверки Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Дополнительные метрики (опционально)
sonar.sourceEncoding=UTF-8

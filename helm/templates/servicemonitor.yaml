{{- if and .Values.serviceMonitor.enabled .Values.backend.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend-monitor
  labels:
    release: prometheus  # Важно: должно совпадать с release Prometheus Operator
spec:
  selector:
    matchLabels:
      app: backend
      release: {{ .Release.Name }}
  endpoints:
    - port: http
      path: {{ .Values.backend.metrics.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}

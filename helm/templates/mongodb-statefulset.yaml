{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mongodb
  labels:
    app: mongodb
    release: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: mongodb
        release: {{ .Release.Name }}
    spec:
      {{- if .Values.mongodb.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.mongodb.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.mongodb.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.mongodb.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.registry }}/{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGODB_INITDB_ROOT_USERNAME
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecret }}
                  key: MONGODB_INITDB_ROOT_USERNAME
            - name: MONGODB_INITDB_ROOT_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecret }}
                  key: MONGODB_INITDB_ROOT_PASSWORD
            - name: MONGODB_DATABASE
              value: {{ .Values.mongodb.auth.database | quote }}
            {{- if .Values.mongodb.auth.username }}
            - name: MONGODB_USERNAME
              value: {{ .Values.mongodb.auth.username | quote }}
            - name: MONGODB_PASSWORD
              value: {{ .Values.mongodb.auth.password | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          {{- if .Values.mongodb.securityContext }}
          securityContext:
            {{- toYaml .Values.mongodb.securityContext | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: mongodb-config
              mountPath: /etc/mongod.conf
              subPath: mongod.conf
              readOnly: true
      volumes:
        - name: mongodb-config
          configMap:
            name: {{ .Release.Name }}-mongodb-config
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
        labels:
          app: mongodb
          release: {{ .Release.Name }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mongodb.persistence.storageClass }}
        storageClassName: {{ .Values.mongodb.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
{{- end }}
